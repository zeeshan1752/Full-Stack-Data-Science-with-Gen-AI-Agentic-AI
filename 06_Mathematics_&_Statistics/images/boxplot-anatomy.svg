<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">Box plot anatomy</title><desc id="desc">A box plot marks the first quartile, median, third quartile, whiskers, and a possible outlier.</desc><rect width="1200" height="460" rx="18" fill="#ffffff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#253247}.heading{font-size:25px;font-weight:700}.label{font-size:20px;font-weight:600}.small{font-size:16px}.axis{stroke:#526174;stroke-width:2;fill:none}.curve{stroke:#2867a8;stroke-width:4;fill:none;stroke-linecap:round}.grid{stroke:#e5eaf0;stroke-width:1}</style><text x="600" y="42" text-anchor="middle" class="heading">Reading a box plot</text><path class="axis" d="M90 330 H1110"/><text x="90" y="375" text-anchor="middle" class="small">Lower values</text><text x="1110" y="375" text-anchor="middle" class="small">Higher values</text><path d="M210 220 H390 M810 220 H980" stroke="#2867a8" stroke-width="5"/><path d="M210 180 V260 M980 180 V260" stroke="#2867a8" stroke-width="5"/><rect x="390" y="155" width="420" height="130" rx="4" fill="#b8d9f2" stroke="#2867a8" stroke-width="4"/><path d="M600 155 V285" stroke="#d04a35" stroke-width="5"/><circle cx="1060" cy="220" r="9" fill="#d04a35"/><path d="M390 155 L340 100 H250 M600 155 V105 M810 155 L855 100 H940 M1060 210 L1030 140 H970" class="axis"/><text x="245" y="90" class="label" text-anchor="middle">Q1</text><text x="600" y="90" class="label" text-anchor="middle">Median (Q2)</text><text x="945" y="90" class="label" text-anchor="middle">Q3</text><text x="965" y="132" class="label" text-anchor="end">Possible outlier</text><text x="600" y="420" text-anchor="middle" class="small">The box spans the interquartile range (IQR = Q3 − Q1).</text></svg>