<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">Confidence interval illustration</title><desc id="desc">A confidence interval is an interval estimate with a lower bound, point estimate, and upper bound; repeated samples produce intervals that vary.</desc><rect width="1200" height="460" rx="18" fill="#ffffff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#253247}.heading{font-size:25px;font-weight:700}.label{font-size:20px;font-weight:600}.small{font-size:16px}.axis{stroke:#526174;stroke-width:2;fill:none}.curve{stroke:#2867a8;stroke-width:4;fill:none;stroke-linecap:round}.grid{stroke:#e5eaf0;stroke-width:1}</style><text x="600" y="42" text-anchor="middle" class="heading">A confidence interval around an estimate</text><path class="axis" d="M130 310 H1070"/><g class="small"><text x="180" y="345" text-anchor="middle">Lower bound</text><text x="600" y="345" text-anchor="middle">Point estimate</text><text x="1010" y="345" text-anchor="middle">Upper bound</text></g><path d="M180 220 H1010" stroke="#2867a8" stroke-width="12" stroke-linecap="round"/><path d="M180 185 V255 M1010 185 V255" stroke="#2867a8" stroke-width="5"/><path d="M600 165 V275" stroke="#d04a35" stroke-width="6"/><circle cx="600" cy="220" r="12" fill="#d04a35"/><text x="600" y="125" text-anchor="middle" class="label">Estimate</text><text x="600" y="405" text-anchor="middle" class="small">Long-run coverage is about 95% for a valid 95% confidence procedure.</text></svg>