<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">Positive, negative, and near-zero correlation scatterplots</title><desc id="desc">Three scatterplots show positive linear association, negative linear association, and no obvious linear association.</desc><rect width="1200" height="460" rx="18" fill="#ffffff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#253247}.heading{font-size:25px;font-weight:700}.label{font-size:20px;font-weight:600}.small{font-size:16px}.axis{stroke:#526174;stroke-width:2;fill:none}.curve{stroke:#2867a8;stroke-width:4;fill:none;stroke-linecap:round}.grid{stroke:#e5eaf0;stroke-width:1}</style><g transform="translate(25,25)"><rect width="360" height="390" rx="12" fill="#f7f9fc"/><text x="180" y="35" text-anchor="middle" class="heading">Positive correlation</text><path class="axis" d="M45 330 H330 M45 330 V70"/><g fill="#2867a8"><circle cx="65" cy="300" r="7"/><circle cx="95" cy="270" r="7"/><circle cx="125" cy="275" r="7"/><circle cx="145" cy="225" r="7"/><circle cx="185" cy="210" r="7"/><circle cx="205" cy="180" r="7"/><circle cx="245" cy="160" r="7"/><circle cx="285" cy="115" r="7"/><circle cx="310" cy="125" r="7"/></g><path d="M55 315 L320 95" stroke="#d04a35" stroke-width="3" stroke-dasharray="7 6"/><text x="180" y="370" text-anchor="middle" class="small">r &gt; 0</text></g><g transform="translate(420,25)"><rect width="360" height="390" rx="12" fill="#f7f9fc"/><text x="180" y="35" text-anchor="middle" class="heading">Negative correlation</text><path class="axis" d="M45 330 H330 M45 330 V70"/><g fill="#2867a8"><circle cx="65" cy="105" r="7"/><circle cx="95" cy="135" r="7"/><circle cx="125" cy="150" r="7"/><circle cx="145" cy="205" r="7"/><circle cx="185" cy="200" r="7"/><circle cx="205" cy="240" r="7"/><circle cx="245" cy="255" r="7"/><circle cx="285" cy="295" r="7"/><circle cx="310" cy="280" r="7"/></g><path d="M55 90 L320 315" stroke="#d04a35" stroke-width="3" stroke-dasharray="7 6"/><text x="180" y="370" text-anchor="middle" class="small">r &lt; 0</text></g><g transform="translate(815,25)"><rect width="360" height="390" rx="12" fill="#f7f9fc"/><text x="180" y="35" text-anchor="middle" class="heading">Little linear correlation</text><path class="axis" d="M45 330 H330 M45 330 V70"/><g fill="#2867a8"><circle cx="65" cy="160" r="7"/><circle cx="95" cy="290" r="7"/><circle cx="125" cy="115" r="7"/><circle cx="145" cy="220" r="7"/><circle cx="185" cy="145" r="7"/><circle cx="205" cy="280" r="7"/><circle cx="245" cy="190" r="7"/><circle cx="285" cy="115" r="7"/><circle cx="310" cy="250" r="7"/></g><text x="180" y="370" text-anchor="middle" class="small">r ≈ 0 (linear pattern)</text></g></svg>