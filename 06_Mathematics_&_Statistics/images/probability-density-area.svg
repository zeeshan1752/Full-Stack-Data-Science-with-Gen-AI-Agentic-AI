<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">Probability as area under a density curve</title><desc id="desc">The probability that a continuous random variable lies between a and b equals the area under its probability density curve between those bounds.</desc><rect width="1200" height="460" rx="18" fill="#ffffff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#253247}.heading{font-size:25px;font-weight:700}.label{font-size:20px;font-weight:600}.small{font-size:16px}.axis{stroke:#526174;stroke-width:2;fill:none}.curve{stroke:#2867a8;stroke-width:4;fill:none;stroke-linecap:round}.grid{stroke:#e5eaf0;stroke-width:1}</style><text x="600" y="42" text-anchor="middle" class="heading">Probability is area under the density curve</text><path class="grid" d="M100 130 H1100 M100 190 H1100 M100 250 H1100"/><path class="axis" d="M100 350 H1100 M100 350 V85"/><path d="M390 350 C430 280 465 185 520 130 C560 90 610 90 650 130 C705 185 740 280 780 350 Z" fill="#b8d9f2" opacity=".9"/><path class="curve" d="M130 348 C240 340 310 300 390 235 C455 180 485 110 570 95 C655 110 685 180 750 235 C830 300 900 340 1070 348"/><path d="M390 350 V235 M780 350 V300" stroke="#d04a35" stroke-width="3" stroke-dasharray="8 7"/><text x="390" y="382" text-anchor="middle" class="label">a</text><text x="780" y="382" text-anchor="middle" class="label">b</text><text x="590" y="245" text-anchor="middle" class="label">Shaded area = P(a ≤ X ≤ b)</text><text x="600" y="425" text-anchor="middle" class="small">fₓ(x) is a density, not a probability at one exact point.</text></svg>