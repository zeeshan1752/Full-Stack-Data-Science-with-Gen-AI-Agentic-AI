<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">Two-tailed hypothesis test</title><desc id="desc">The central area represents values less extreme under the null distribution; shaded tails represent a two-tailed rejection region at a chosen significance level.</desc><rect width="1200" height="460" rx="18" fill="#ffffff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#253247}.heading{font-size:25px;font-weight:700}.label{font-size:20px;font-weight:600}.small{font-size:16px}.axis{stroke:#526174;stroke-width:2;fill:none}.curve{stroke:#2867a8;stroke-width:4;fill:none;stroke-linecap:round}.grid{stroke:#e5eaf0;stroke-width:1}</style><text x="600" y="42" text-anchor="middle" class="heading">Two-tailed test: rejection regions</text><path class="axis" d="M130 350 H1080 M130 350 V90"/><path d="M130 350 C250 350 310 330 390 260 C465 190 500 105 605 95 C710 105 745 190 820 260 C900 330 960 350 1080 350" fill="#dcebf8" stroke="none"/><path d="M130 350 C250 350 310 330 390 260 C465 190 500 105 605 95 C710 105 745 190 820 260 C900 330 960 350 1080 350" stroke="#2867a8" stroke-width="4" fill="none"/><path d="M130 350 C250 350 310 330 390 260 C410 240 425 215 440 190 L440 350 Z" fill="#efb2a8"/><path d="M770 190 C785 215 800 240 820 260 C900 330 960 350 1080 350 L770 350 Z" fill="#efb2a8"/><path d="M440 350 V190 M770 350 V190" stroke="#d04a35" stroke-width="3" stroke-dasharray="7 6"/><text x="300" y="300" class="label">α/2</text><text x="900" y="300" class="label">α/2</text><text x="605" y="410" text-anchor="middle" class="small">Reject H₀ when the statistic falls in either tail.</text></svg>