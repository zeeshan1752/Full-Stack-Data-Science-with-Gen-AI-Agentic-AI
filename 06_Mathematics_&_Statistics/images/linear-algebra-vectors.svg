<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">Vector addition and components</title><desc id="desc">A vector is represented by magnitude and direction; its horizontal and vertical components combine to form the vector.</desc><rect width="1200" height="460" rx="18" fill="#ffffff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#253247}.heading{font-size:25px;font-weight:700}.label{font-size:20px;font-weight:600}.small{font-size:16px}.axis{stroke:#526174;stroke-width:2;fill:none}.curve{stroke:#2867a8;stroke-width:4;fill:none;stroke-linecap:round}.grid{stroke:#e5eaf0;stroke-width:1}</style><text x="600" y="42" text-anchor="middle" class="heading">A vector and its components</text><path class="axis" d="M180 350 H1050 M180 350 V85"/><path d="M180 350 L820 125" stroke="#2867a8" stroke-width="6"/><path d="M180 350 L820 350" stroke="#27815b" stroke-width="5" stroke-dasharray="9 6"/><path d="M820 350 V125" stroke="#d04a35" stroke-width="5" stroke-dasharray="9 6"/><path d="M800 130 L820 125 L810 145" stroke="#2867a8" stroke-width="5" fill="none"/><text x="490" y="375" text-anchor="middle" class="label">x-component</text><text x="845" y="245" class="label">y-component</text><text x="520" y="205" class="label">v</text><text x="600" y="420" text-anchor="middle" class="small">Vector v = (vₓ, vᵧ); components show horizontal and vertical contribution.</text></svg>