<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">Derivative as slope of a tangent</title><desc id="desc">The derivative at a point gives the slope of the tangent line to a differentiable curve at that point.</desc><rect width="1200" height="460" rx="18" fill="#ffffff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#253247}.heading{font-size:25px;font-weight:700}.label{font-size:20px;font-weight:600}.small{font-size:16px}.axis{stroke:#526174;stroke-width:2;fill:none}.curve{stroke:#2867a8;stroke-width:4;fill:none;stroke-linecap:round}.grid{stroke:#e5eaf0;stroke-width:1}</style><text x="600" y="42" text-anchor="middle" class="heading">Derivative = instantaneous slope</text><path class="grid" d="M130 130 H1080 M130 200 H1080 M130 270 H1080"/><path class="axis" d="M130 350 H1080 M130 350 V80"/><path d="M180 325 C320 315 420 275 520 220 C640 155 790 115 1040 95" stroke="#2867a8" stroke-width="5" fill="none"/><path d="M360 300 L790 130" stroke="#d04a35" stroke-width="4" stroke-dasharray="9 6"/><circle cx="600" cy="184" r="9" fill="#d04a35"/><path d="M600 184 L680 95 H835" class="axis"/><text x="840" y="100" class="label">Tangent at x</text><text x="600" y="420" text-anchor="middle" class="small">The tangent slope is f′(x); it describes local rate of change.</text></svg>