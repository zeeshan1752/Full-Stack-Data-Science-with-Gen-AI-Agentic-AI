<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">Bias variance trade-off</title><desc id="desc">As model complexity increases, bias squared typically decreases, variance typically increases, and their combined prediction error may form a U-shaped curve.</desc><rect width="1200" height="460" rx="18" fill="#ffffff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#253247}.heading{font-size:25px;font-weight:700}.label{font-size:20px;font-weight:600}.small{font-size:16px}.axis{stroke:#526174;stroke-width:2;fill:none}.curve{stroke:#2867a8;stroke-width:4;fill:none;stroke-linecap:round}.grid{stroke:#e5eaf0;stroke-width:1}</style><text x="600" y="42" text-anchor="middle" class="heading">Bias–variance trade-off (conceptual)</text><path class="grid" d="M130 120 H1080 M130 190 H1080 M130 260 H1080 M130 330 H1080"/><path class="axis" d="M130 355 V85 M130 355 H1090"/><text x="40" y="220" transform="rotate(-90 40 220)" text-anchor="middle" class="label">Error</text><text x="610" y="420" text-anchor="middle" class="label">Model complexity →</text><path d="M150 125 C300 135 390 205 520 260 S830 325 1060 340" stroke="#2867a8" stroke-width="5" fill="none"/><path d="M150 340 C350 335 480 290 600 230 S850 130 1060 100" stroke="#d04a35" stroke-width="5" fill="none"/><path d="M150 145 C300 150 390 200 510 245 S710 285 820 275 S980 240 1060 215" stroke="#27815b" stroke-width="5" fill="none"/><text x="180" y="105" class="label">Bias²</text><text x="920" y="90" class="label">Variance</text><text x="820" y="250" class="label">Total error (illustrative)</text><text x="610" y="390" text-anchor="middle" class="small">Shape is conceptual; actual curves depend on the data and model.</text></svg>