<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">Regression line and residuals</title><desc id="desc">Observed data points are compared with a fitted straight line; vertical segments show residuals between observed and fitted values.</desc><rect width="1200" height="460" rx="18" fill="#ffffff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#253247}.heading{font-size:25px;font-weight:700}.label{font-size:20px;font-weight:600}.small{font-size:16px}.axis{stroke:#526174;stroke-width:2;fill:none}.curve{stroke:#2867a8;stroke-width:4;fill:none;stroke-linecap:round}.grid{stroke:#e5eaf0;stroke-width:1}</style><text x="600" y="42" text-anchor="middle" class="heading">Observed values, fitted line, and residuals</text><path class="grid" d="M120 130 H1090 M120 200 H1090 M120 270 H1090"/><path class="axis" d="M120 350 H1090 M120 350 V80"/><path d="M160 320 L1040 105" stroke="#2867a8" stroke-width="5" fill="none"/><g stroke="#d04a35" stroke-width="3" stroke-dasharray="6 5"><path d="M390 265 V235"/><path d="M530 225 V240"/><path d="M670 195 V165"/><path d="M810 160 V205"/><path d="M950 135 V120"/></g><g fill="#d04a35"><circle cx="250" cy="300" r="8"/><circle cx="390" cy="265" r="8"/><circle cx="530" cy="225" r="8"/><circle cx="670" cy="195" r="8"/><circle cx="810" cy="160" r="8"/><circle cx="950" cy="135" r="8"/></g><path d="M390 235 L450 175 H560" class="axis"/><text x="565" y="168" class="label">Residual = observed − fitted</text><text x="600" y="420" text-anchor="middle" class="small">Residuals are vertical differences from each observed point to the fitted line.</text></svg>