<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">Three distribution shapes: skewness comparison</title><desc id="desc">Negative skew has a longer left tail, a symmetric distribution has balanced tails, and positive skew has a longer right tail.</desc><rect width="1200" height="460" rx="18" fill="#ffffff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#253247}.heading{font-size:25px;font-weight:700}.label{font-size:20px;font-weight:600}.small{font-size:16px}.axis{stroke:#526174;stroke-width:2;fill:none}.curve{stroke:#2867a8;stroke-width:4;fill:none;stroke-linecap:round}.grid{stroke:#e5eaf0;stroke-width:1}</style><g transform="translate(25,20)"><rect width="365" height="410" rx="12" fill="#f7f9fc"/><text x="182" y="38" text-anchor="middle" class="heading">Negative skew</text><path class="axis" d="M35 330 H335 M35 330 V78"/><path d="M35 330 C80 327 105 315 140 270 C175 220 190 130 220 115 C260 95 285 235 335 328 L335 330 Z" fill="#b8d9f2"/><path class="curve" d="M35 330 C80 327 105 315 140 270 C175 220 190 130 220 115 C260 95 285 235 335 328"/><text x="182" y="365" class="small">← Longer left tail</text><text x="182" y="395" text-anchor="middle" class="small">Mean &lt; median (often)</text></g><g transform="translate(417,20)"><rect width="365" height="410" rx="12" fill="#f7f9fc"/><text x="182" y="38" text-anchor="middle" class="heading">Symmetric</text><path class="axis" d="M35 330 H335 M35 330 V78"/><path d="M35 328 C75 322 100 280 130 205 C155 140 170 112 182 112 C194 112 210 140 235 205 C265 280 290 322 335 328 L335 330 Z" fill="#b8d9f2"/><path class="curve" d="M35 328 C75 322 100 280 130 205 C155 140 170 112 182 112 C194 112 210 140 235 205 C265 280 290 322 335 328"/><text x="182" y="365" text-anchor="middle" class="small">Balanced tails</text><text x="182" y="395" text-anchor="middle" class="small">Mean ≈ median (often)</text></g><g transform="translate(809,20)"><rect width="365" height="410" rx="12" fill="#f7f9fc"/><text x="182" y="38" text-anchor="middle" class="heading">Positive skew</text><path class="axis" d="M35 330 H335 M35 330 V78"/><path d="M35 328 C80 235 105 95 145 115 C175 130 190 220 220 270 C255 315 290 327 335 330 L335 330 Z" fill="#b8d9f2"/><path class="curve" d="M35 328 C80 235 105 95 145 115 C175 130 190 220 220 270 C255 315 290 327 335 330"/><text x="182" y="365" class="small">Longer right tail →</text><text x="182" y="395" text-anchor="middle" class="small">Mean &gt; median (often)</text></g></svg>